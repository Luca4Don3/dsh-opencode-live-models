name: test

on:
  push:
    branches: [main]
  # main requires changes to go through a pull request, so this trigger is for a
  # path the repository is configured to use even though no run has come from it
  # yet: `enforce_admins` is off, so the owner pushes directly and bypasses the
  # rule. Removing it would leave a PR from anyone who *cannot* bypass the rule
  # merging without this workflow ever running.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push that supersedes an in-flight run makes the older one obsolete, and
  # letting both finish spends a runner on a tree nobody will read.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # The suite runs in about 30s. A hanging fetch should fail the job rather
    # than hold a runner for the 360-minute default.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The plugin declares node >= 18, and the suite uses nothing newer than
        # that: 18 is the floor, 24 is what DSH actually ships with.
        node: ['18', '24']
    steps:
      # v5 and up run on Node 24; v4 ran on Node 20, which GitHub has
      # deprecated for actions.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No install step: the plugin has no dependencies, and probe.mjs resolves
      # its fixtures relative to this file, so the tree is all it needs.
      - name: npm test
        run: npm test
